services:
  - type: web
    name: graduation-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node src/app.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
        # ⚠️ 部署时必须手动设置 DATABASE_URL 环境变量
        # 从 https://neon.tech 获取 PostgreSQL 连接串
      - key: FRONTEND_URL
        value: "*"